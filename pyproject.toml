[project]
name = "fuelbuddy"
version = "0.0.4"
description = "fuelbuddy"
authors = [
    {name = "ibsl", email = "ibsl@gmail.com"}
]
requires-python = ">=3.10"
readme = "README.md"
license = {file = "license.txt"}

[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "fuelbuddy"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
